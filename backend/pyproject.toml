[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-essay-detector-backend"
version = "0.1.0"
description = "Evidence-based AI-writing analysis backend for admissions essays."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "httpx~=0.28.1",
    "ruff~=0.16.3",
    "mypy~=2.3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "B008"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["tests/"]